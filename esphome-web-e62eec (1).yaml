esphome:
  name: esphome-web-e62eec
  friendly_name: AeroMetric-Airquality-monitor
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  board: esp32
  framework:
    type: arduino
  variant: ESP32

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:

captive_portal:

  
# Allow Over-The-Air updates
ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: false
  power_save_mode: NONE
  output_power: 15.0dB  # Lowers the transmission power from 20dB to prevent RF echo loops

  ap:
    ssid: AeroMetric-Setuphotspot
i2c:
  - scl: 22
    sda: 21
    id: i2c_1

sensor:
  - platform: sen5x
    i2c_id: i2c_1
    humidity:
      id: sensor_sen5x_1_humidity
      name: rh_value_sensor
      on_value:
        then:
          - lvgl.label.update:
              id: rh_value_lvgl
              text: !lambda |-
                static char buf[16];
                // Formats the float to 1 decimal place (e.g., "21.5 °C")
                snprintf(buf, sizeof(buf), "%.1f °C", id(sensor_sen5x_1_humidity).state);
                return buf;
    pm_10_0:
      id: sensor_sen5x_1_pm_10_0
      name: pm10_value_sensor
      on_value:
        then:
          - lvgl.label.update:
              id: pm10_value_lvgl
              text: !lambda |-
                static char buf[16];
                // Formats the float to 1 decimal place (e.g., "21.5 °C")
                snprintf(buf, sizeof(buf), "%.1f °C", id(sensor_sen5x_1_pm_10_0).state);
                return buf;
    pm_1_0:
      id: sensor_sen5x_1_pm_1_0
      name: pm1_value_sensor
      on_value:
        then:
          - lvgl.label.update:
              id: pm1_value_lvgl
              text: !lambda |-
                static char buf[16];
                // Formats the float to 1 decimal place (e.g., "21.5 °C")
                snprintf(buf, sizeof(buf), "%.1f °C", id(sensor_sen5x_1_pm_1_0).state);
                return buf;
    pm_2_5:
      id: sensor_sen5x_1_pm_2_5
      name: pm25_value_sensor
      on_value:
        then:
          - lvgl.label.update:
              id: pm25_value_lvgl
              text: !lambda |-
                static char buf[16];
                // Formats the float to 1 decimal place (e.g., "21.5 °C")
                snprintf(buf, sizeof(buf), "%.1f °C", id(sensor_sen5x_1_pm_2_5).state);
                return buf;
      
    pm_4_0:
      id: sensor_sen5x_1_pm_4_0
      name: pm4_value_sensor
      on_value:
        then:
          - lvgl.label.update:
              id: pm4_value_lvgl
              text: !lambda |-
                static char buf[16];
                // Formats the float to 1 decimal place (e.g., "21.5 °C")
                snprintf(buf, sizeof(buf), "%.1f °C", id(sensor_sen5x_1_pm_4_0).state);
                return buf;

      
    temperature:
      id: sensor_sen5x_1_temperature
      name: temp_value_sensor
      on_value:
        then:
          - lvgl.label.update:
              id: temp_value_lvgl
              text: !lambda |-
                static char buf[16];
                // Formats the float to 1 decimal place (e.g., "21.5 °C")
                snprintf(buf, sizeof(buf), "%.1f °C", id(sensor_sen5x_1_temperature).state);
                return buf;

    voc:
      id: sensor_sen5x_1_voc
      name: vocs_value_sensor
      on_value:
        then:
          - lvgl.label.update:
              id: vocs_value_lvgl
              text: !lambda |-
                static char buf[16];
                // Formats the float to 1 decimal place (e.g., "21.5 °C")
                snprintf(buf, sizeof(buf), "%.1f °C", id(sensor_sen5x_1_voc).state);
                return buf;
    id: sensor_sen5x_1
  - platform: aqi
    name: AQI
    calculation_type: CAQI
    pm_10_0: sensor_sen5x_1_pm_10_0
    pm_2_5: sensor_sen5x_1_pm_2_5
    id: sensor_aqi_1
    icon: "mdi:leaf"
    on_value:
      then:
        - lvgl.widget.update:
            id: Leaf
            # We use a C++ lambda to switch the text color property dynamically
            text_color: !lambda |-
              float aqi = id(sensor_aqi_1).state;
              if (aqi <= 25) {
                return lv_color_hex(0x4CAF50); // Green
              } else if (aqi <= 50) {
                return lv_color_hex(0xFFEB3B); // Yellow
              } else if (aqi <= 75) {
                return lv_color_hex(0xFF9800); // Orange
              } else {
                return lv_color_hex(0xF44336); // Red
              }

