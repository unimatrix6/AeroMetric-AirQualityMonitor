esphome:
  name: esphome-web-e62eec
  friendly_name: AeroMetric-Airquality-monitor
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  board: esp32
  framework:
    type: arduino
  variant: ESP32

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:

captive_portal:

  
# Allow Over-The-Air updates
ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: false
  power_save_mode: NONE
  output_power: 15.0dB  # Lowers the transmission power from 20dB to prevent RF echo loops

  ap:
    ssid: AeroMetric-Setuphotspot
i2c:
  - scl: 22
    sda: 21
    id: i2c_1

sensor:
  - platform: sen5x
    i2c_id: i2c_1
    humidity:
      id: sensor_sen5x_1_humidity
      name: rh_value
    pm_10_0:
      id: sensor_sen5x_1_pm_10_0
      name: pm10_value
    pm_1_0:
      id: sensor_sen5x_1_pm_1_0
      name: pm1_value
    pm_2_5:
      id: sensor_sen5x_1_pm_2_5
      name: pm25_value
    pm_4_0:
      id: sensor_sen5x_1_pm_4_0
      name: pm4_value
    temperature:
      id: sensor_sen5x_1_temperature
      name: temp_value
    voc:
      id: sensor_sen5x_1_voc
      name: vocs_value
    id: sensor_sen5x_1

mdns:





spi:
  - clk_pin: GPIO18
    id: spi_1
    mosi_pin: GPIO23

display:
  - platform: mipi_spi
    model: ILI9488
    id: display_mipi_spi_1
    cs_pin: GPIO5
    dc_pin: GPIO16
    reset_pin: GPIO17
    color_depth: "16"
    dimensions:
      height: 480
      width: 320
      
    transform:
      swap_xy: false
      mirror_x: true   # Flips the mirroring horizontally
      mirror_y: false  # Set to true if text is also upside down


font:
  - file:
      url: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
      type: web
    id: mdi_icons_24
    size: 24
    glyphs: [
      "\U000F032A",  # Leaf
    ]
lvgl:
  pages:
    - id: canvas_1
      bg_color: 0x02111B
      pad_all: 0
      widgets:
        - obj:
            id: lv_obj_2
            x: -35
            y: -35
            width: 125
            height: 125
            bg_color: 0x31313B
            border_width: 0
            border_color: 0x4B5563
