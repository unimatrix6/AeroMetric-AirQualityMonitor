esphome:
  name: esphome-web-e62eec
  friendly_name: AeroMetric-Airquality-monitor
  min_version: 2026.4.0
  name_add_mac_suffix: false
  on_boot:
    then:
      - delay:
          seconds: '10'
      - lvgl.page.show: canvas_1
      

esp32:
  board: esp32
  framework:
    type: esp-idf
  variant: ESP32

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:

captive_portal:

  
# Allow Over-The-Air updates
ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: false
  power_save_mode: NONE
  output_power: 15.0dB  # Lowers the transmission power from 20dB to prevent RF echo loops
   # Automations for connection status
  on_connect:
    then:
      - lvgl.label.update:
          id: wifi_icon
          text_color: 0xCCCCCC  # White when connected

  on_disconnect:
    then:
      - lvgl.label.update:
          id: wifi_icon
          text_color: 0xff0000  # Red when disconnected
  
  ap:
    ssid: AeroMetric-Setuphotspot
i2c:
  - scl: 22
    sda: 21
    id: i2c_1

sensor:
  - platform: sen5x
    i2c_id: i2c_1
    humidity:
      id: sensor_sen5x_1_humidity
      name: rh_value_sensor
      on_value:
        then:
          - lvgl.label.update:
              id: rh_value_lvgl
              text: !lambda |-
                static char buf[16];
                // Formats the float to 1 decimal place (e.g., "21.5 °C")
                snprintf(buf, sizeof(buf), "%.0f", id(sensor_sen5x_1_humidity).state);
                return buf;
    pm_10_0:
      id: sensor_sen5x_1_pm_10_0
      name: pm10_value_sensor
      on_value:
        then:
          - lvgl.label.update:
              id: pm10_value_lvgl
              text: !lambda |-
                static char buf[16];
                // Formats the float to 1 decimal place (e.g., "21.5 °C")
                snprintf(buf, sizeof(buf), "%.0f", id(sensor_sen5x_1_pm_10_0).state);
                return buf;
    pm_1_0:
      id: sensor_sen5x_1_pm_1_0
      name: pm1_value_sensor
      on_value:
        then:
          - lvgl.label.update:
              id: pm1_value_lvgl
              text: !lambda |-
                static char buf[16];
                // Formats the float to 1 decimal place (e.g., "21.5 °C")
                snprintf(buf, sizeof(buf), "%.0f", id(sensor_sen5x_1_pm_1_0).state);
                return buf;
    pm_2_5:
      id: sensor_sen5x_1_pm_2_5
      name: pm25_value_sensor
      on_value:
        then:
          - lvgl.label.update:
              id: pm25_value_lvgl
              text: !lambda |-
                static char buf[16];
                // Formats the float to 1 decimal place (e.g., "21.5 °C")
                snprintf(buf, sizeof(buf), "%.0f", id(sensor_sen5x_1_pm_2_5).state);
                return buf;
      
    pm_4_0:
      id: sensor_sen5x_1_pm_4_0
      name: pm4_value_sensor
      on_value:
        then:
          - lvgl.label.update:
              id: pm4_value_lvgl
              text: !lambda |-
                static char buf[16];
                // Formats the float to 1 decimal place (e.g., "21.5 °C")
                snprintf(buf, sizeof(buf), "%.0f", id(sensor_sen5x_1_pm_4_0).state);
                return buf;

      
    temperature:
      id: sensor_sen5x_1_temperature
      name: temp_value_sensor
      on_value:
        then:
          - lvgl.label.update:
              id: temp_value_lvgl
              text: !lambda |-
                static char buf[16];
                // Formats the float to 1 decimal place (e.g., "21.5 °C")
                snprintf(buf, sizeof(buf), "%.0f", id(sensor_sen5x_1_temperature).state);
                return buf;

    voc_index:
      id: sensor_sen5x_1_voc
      name: vocs_value_sensor
      on_value:
        then:
          - lvgl.label.update:
              id: vocs_value_lvgl
              text: !lambda |-
                static char buf[16];
                // Formats the float to 1 decimal place (e.g., "21.5 °C")
                snprintf(buf, sizeof(buf), "%.0f", id(sensor_sen5x_1_voc).state);
                return buf;
    id: sensor_sen5x_1
  - platform: aqi
    name: AQI
    calculation_type: CAQI
    pm_10_0: sensor_sen5x_1_pm_10_0
    pm_2_5: sensor_sen5x_1_pm_2_5
    id: sensor_aqi_1
    icon: "mdi:leaf"
    on_value:
      then:
        - lvgl.label.update:
            id: aqi_value_lvgl
            text: !lambda |-
              static char buf[16];
              snprintf(buf, sizeof(buf), "%.0f", x);
              return buf;
              
        - lambda: |-
            if (x < 25.0) {
              lv_obj_set_style_outline_color(id(aqi_ring), lv_color_hex(0x00E5FF), LV_STATE_DEFAULT);
            } else if (x < 75.0) {
              lv_obj_set_style_outline_color(id(aqi_ring), lv_color_hex(0xFFFF00), LV_STATE_DEFAULT);
            } else {
              // Covers everything from 75 up to 100+
              lv_obj_set_style_outline_color(id(aqi_ring), lv_color_hex(0xFF0000), LV_STATE_DEFAULT);
            }
        
        - lambda: |-
            if (x < 25.0) {
              lv_obj_set_style_outline_color(id(aqi_ring), lv_color_hex(0x00E5FF), LV_STATE_DEFAULT);
              lv_label_set_text(id(aqi_fb), "Good");
            } else if (x < 75.0) {
              lv_obj_set_style_outline_color(id(aqi_ring), lv_color_hex(0xFFFF00), LV_STATE_DEFAULT);
              lv_label_set_text(id(aqi_fb), "Med");
            } else {
              lv_obj_set_style_outline_color(id(aqi_ring), lv_color_hex(0xFF0000), LV_STATE_DEFAULT);
              lv_label_set_text(id(aqi_fb), "Bad");
            }

mdns:





spi:
  - clk_pin: GPIO18
    id: spi_1
    mosi_pin: GPIO23

display:
  - platform: mipi_spi
    model: ILI9488
    id: display_mipi_spi_1
    cs_pin: GPIO5
    dc_pin: GPIO16
    reset_pin: GPIO17
    color_depth: "16"
    dimensions:
      height: 480
      width: 320
      
    transform:
      swap_xy: false
      mirror_x: true   # Flips the mirroring horizontally
      mirror_y: false  # Set to true if text is also upside down



output:
  - platform: ledc
    pin: GPIO33
    id: Display_brightness

# Example usage in a light
light:
  - platform: monochromatic
    output: Display_brightness
    name: Display_Brightness
    restore_mode: RESTORE_DEFAULT_ON

time:
  - platform: sntp
    id: my_time
    timezone: "Europe/Berlin"
    update_interval: 1min
    on_time:
      # This triggers exactly every minute when the seconds hit 00
      - seconds: 0
        then:
          - lvgl.label.update:
              id: time_label
              text: !lambda |-
                static char buf[16];
                auto time_now = id(my_time).now();
                if (time_now.is_valid()) {
                  // Format: HH:MM (Hours and Minutes)
                  strftime(buf, sizeof(buf), "%H:%M", localtime(&time_now.timestamp));
                  return std::string(buf);
                } else {
                  return std::string("Connecting...");
                }




