esphome:
  on_boot:
    then:
      - delay: 10s
      - lvgl.page.show: canvas_1

wifi:
  on_connect:
    then:
      - lvgl.label.update:
          id: wifi_icon
          text_color: 0xCCCCCC  # White when connected
  on_disconnect:
    then:
      - lvgl.label.update:
          id: wifi_icon
          text_color: 0xff0000  # Red when disconnected



spi:
  - clk_pin: GPIO18
    id: spi_1
    mosi_pin: GPIO23

display:
  - platform: mipi_spi
    model: ILI9488
    id: display_mipi_spi_1
    cs_pin: GPIO5
    dc_pin: GPIO16
    reset_pin: GPIO17
    color_depth: "16"
    dimensions:
      height: 480
      width: 320
      
    transform:
      swap_xy: false
      mirror_x: true   # Flips the mirroring horizontally
      mirror_y: false  # Set to true if text is also upside down



output:
  - platform: ledc
    pin: GPIO33
    id: Display_brightness

# Example usage in a light
light:
  - platform: monochromatic
    output: Display_brightness
    name: Display_Brightness
    restore_mode: RESTORE_DEFAULT_ON

image:
  - file: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/esphome.png"
    id: img_esphome
    resize: 145x135
    type: RGB565

 
                
font:

  - file:
      url: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
      type: web
    id: mdi_icons_25
    size: 25
    glyphs: [
      "\U000F0928",  # Wifi Strength 4
      ]
  
  - file:
      type: gfonts
      family: Montserrat
      weight: 500
    id: montserrat_25
    size: 25
    bpp: 4
    glyphsets: [GF_Latin_Core]
    
  - file:
      type: gfonts
      family: Comfortaa
      weight: 700
    id: comfortaa_18b
    size: 18
    bpp: 4
    glyphsets: [GF_Latin_Core]

  - file:
      url: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
      type: web
    id: mdi_icons_19
    size: 19
    glyphs: [
      "\U000F0928",  # Wifi Strength 4
    ]

   
    
