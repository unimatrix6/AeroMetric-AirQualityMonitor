esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.4.0
  name_add_mac_suffix: true

esp32:
  board: esp32
  framework:
    type: esp-idf
  variant: ESP32

logger:
  level: DEBUG

api:

captive_portal:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: false
  power_save_mode: NONE
  output_power: 15.0dB  # Lowers the transmission power from 20dB to prevent RF echo loops
  ap:
    ssid: "AeroMetric-Setuphotspot"

