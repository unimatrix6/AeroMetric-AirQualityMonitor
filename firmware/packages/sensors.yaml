i2c:
  - scl: 22
    sda: 21
    id: i2c_1

sensor:
  - platform: sen5x
    id: sensor_sen5x_1
    i2c_id: i2c_1

    humidity:
      id: sensor_sen5x_1_humidity
      name: "Humidity"
      on_value:
        then:
          - lvgl.label.update:
              id: rh_value_lvgl
              text: !lambda |-
                static char buf[16];
                snprintf(buf, sizeof(buf), "%.0f", x);
                return buf;

    pm_10_0:
