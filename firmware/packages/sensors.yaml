i2c:
  - scl: 22
    sda: 21
    id: i2c_1

sensor:
  - platform: sen5x
    id: sensor_sen5x_1
    i2c_id: i2c_1

    humidity:
      id: sensor_sen5x_1_humidity
      name: "Humidity"
      on_value:
        then:
          - lvgl.label.update:
              id: rh_value_lvgl
              text: !lambda |-
                static char buf[16];
                snprintf(buf, sizeof(buf), "%.0f", x);
                return buf;

    pm_10_0:
      id: sensor_sen5x_1_pm_10_0
      name: "PM 10.0"
      on_value:
        then:
          - lvgl.label.update:
              id: pm10_value_lvgl
              text: !lambda |-
                static char buf[16];
                snprintf(buf, sizeof(buf), "%.0f", x);
                return buf;

    pm_1_0:
      id: sensor_sen5x_1_pm_1_0
      name: "PM 1.0"
      on_value:
        then:
          - lvgl.label.update:
              id: pm1_value_lvgl
              text: !lambda |-
                static char buf[16];
                snprintf(buf, sizeof(buf), "%.0f", x);
                return buf;

    pm_2_5:
      id: sensor_sen5x_1_pm_2_5
      name: "PM 2.5"
      on_value:
        then:
          - lvgl.label.update:
              id: pm25_value_lvgl
              text: !lambda |-
                static char buf[16];
                snprintf(buf, sizeof(buf), "%.0f", x);
                return buf;

    pm_4_0:
      id: sensor_sen5x_1_pm_4_0
      name: "PM 4.0"
      on_value:
        then:
          - lvgl.label.update:
