                return buf;

    temperature:
      id: sensor_sen5x_1_temperature
      name: "Temperature"
      on_value:
        then:
          - lvgl.label.update:
              id: temp_value_lvgl
              text: !lambda |-
                static char buf[16];
                snprintf(buf, sizeof(buf), "%.0f", x);
                return buf;

    voc_index:
      id: sensor_sen5x_1_voc
      name: "VOC Index"
      on_value:
        then:
          - lvgl.label.update:
              id: vocs_value_lvgl
              text: !lambda |-
                static char buf[16];
                snprintf(buf, sizeof(buf), "%.0f", x);
                return buf;

  - platform: aqi
    id: sensor_aqi_1
    name: "AQI"
    calculation_type: CAQI
    pm_10_0: sensor_sen5x_1_pm_10_0
    pm_2_5: sensor_sen5x_1_pm_2_5
    icon: "mdi:leaf"
    on_value:
      then:
        - lvgl.label.update:
            id: aqi_value_lvgl
            text: !lambda |-
              static char buf[16];
              snprintf(buf, sizeof(buf), "%.0f", x);
              return buf;
        - lambda: |-
            if (x < 25.0) {
              lv_obj_set_style_outline_color(id(aqi_ring), lv_color_hex(0x00E5FF), LV_STATE_DEFAULT);
              lv_label_set_text(id(aqi_fb), "Good");
            } else if (x < 75.0) {
              lv_obj_set_style_outline_color(id(aqi_ring), lv_color_hex(0xFFFF00), LV_STATE_DEFAULT);
              lv_label_set_text(id(aqi_fb), "Med");
            } else {
              lv_obj_set_style_outline_color(id(aqi_ring), lv_color_hex(0xFF0000), LV_STATE_DEFAULT);
              lv_label_set_text(id(aqi_fb), "Bad");
            }

